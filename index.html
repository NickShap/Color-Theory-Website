<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center">Color Categories</h1>
            </div>
            <br>
            <div class="row">
                <div class="col-12">
                    <h3 class="text-center">Primary Colors</h3>
                </div>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-4">
                <div id="red"></div>
                <h4 class="text-center"> Red #FF0000</h4>
            </div>

            <div class="col-4">
                <div id="blue"></div>
                <h4 class="text-center"> Blue #0000FF</h4>
            </div>

            <div class="col-4">
                <div id="yellow"></div>
                <h4 class="text-center"> Yellow #FFFF00</h4>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-12">
                <h3 class="text-center">Secondary Colors</h3>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-4">
                <div id="green"></div>
                <h4 class="text-center"> Green #008000</h4>
            </div>

            <div class="col-4">
                <div id="orange"></div>
                <h4 class="text-center"> Orange #FFA500</h4>
            </div>

            <div class="col-4">
                <div id="purple"></div>
                <h4 class="text-center"> Purple #800080</h4>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <h3 class="text-center">Tertiary Colors</h3>
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col-2">
                <div id="red-orange"></div>
                <h4 class="text-center"> Red-Orange #FF4433</h4>
            </div>

            <div class="col-2">
                <div id="yellow-orange"></div>
                <h4 class="text-center"> Yellow-Orange #FFAE42</h4>
            </div>
            <div class="col-2">
                <div id="yellow-green"></div>
                <h4 class="text-center"> Yellow-Green #9ACD32</h4>
            </div>
            <div class="col-2">
                <div id="blue-green"></div>
                <h4 class="text-center"> Blue-Green #0D98BA</h4>
            </div>
            <div class="col-2">
                <div id="blue-violet"></div>
                <h4 class="text-center"> Blue-Violet #8A2BE2</h4>
            </div>
            <div class="col-2">
                <div id="red-violet"></div>
                <h4 class="text-center"> Red-Violet #C71585</h4>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
